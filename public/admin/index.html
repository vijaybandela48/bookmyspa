<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel — BookMySpa</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>
<div class="wrap page-body">
  <div class="eyebrow">Platform admin</div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <h1 style="margin-top:4px">Admin panel</h1>
    <button class="btn small outline" onclick="downloadBackup()" id="backupBtn" title="Download a full copy of the database">⬇ Download backup</button>
  </div>

  <div id="backupBanner"></div>
  <div class="stat-grid" id="stats" style="margin-top:24px"></div>

  <div class="tabs">
    <div class="tab active" data-tab="spas" onclick="switchTab('spas')">🏢 Spas</div>
    <div class="tab" data-tab="bookings" onclick="switchTab('bookings')">📅 Bookings</div>
    <div class="tab" data-tab="transactions" onclick="switchTab('transactions')">💳 Transactions</div>
    <div class="tab" data-tab="customers" onclick="switchTab('customers')">🙋 Customers</div>
    <div class="tab" data-tab="owners" onclick="switchTab('owners')">🧑‍💼 Spa owners</div>
    <div class="tab" data-tab="settlements" onclick="switchTab('settlements')">💸 Commission &amp; payouts</div>
    <div class="tab" data-tab="featured" onclick="switchTab('featured')">⭐ Featured</div>
    <div class="tab" data-tab="reviews" onclick="switchTab('reviews')">📝 Reviews</div>
    <div class="tab" data-tab="backups" onclick="switchTab('backups')">💾 Backups</div>
    <div class="tab" data-tab="messages" onclick="switchTab('messages')">✉️ Messages <span id="msgBadge"></span></div>
  </div>

  <div id="tab-spas"><div id="spaList"><p>Loading…</p></div></div>
  <div id="tab-bookings" style="display:none"><input id="bookingSearch" placeholder="🔎 Track a booking — search by booking ID (BMS-…), customer name, phone or spa" oninput="clearTimeout(window._bs); window._bs = setTimeout(loadBookings, 300)" style="margin-bottom:14px"><div id="bookingList"><p>Loading…</p></div></div>
  <div id="tab-transactions" style="display:none"><div id="transactionList"><p>Loading…</p></div></div>
  <div id="tab-customers" style="display:none"><input id="custSearch" placeholder="🔎 Search customers by name, email or phone" oninput="loadCustomers()" style="margin-bottom:14px"><div id="customerList"><p>Loading…</p></div></div>
  <div id="tab-owners" style="display:none"><input id="ownerSearch" placeholder="🔎 Search owners by name, email, phone or spa" oninput="loadOwners()" style="margin-bottom:14px"><div id="ownerList"><p>Loading…</p></div></div>
  <div id="tab-settlements" style="display:none"><div id="settlementList"><p>Loading…</p></div></div>
  <div id="tab-featured" style="display:none"><div id="featuredAdmin"><p>Loading…</p></div></div>
  <div id="tab-reviews" style="display:none"><div id="reviewAdmin"><p>Loading…</p></div></div>
  <div id="tab-backups" style="display:none"><div id="backupPanel"><p>Loading…</p></div></div>
  <div id="tab-messages" style="display:none"><div id="messageList"><p>Loading…</p></div></div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:640px;max-height:85vh;overflow-y:auto">
    <div id="detailModalBody"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
renderNav('admin');
const AUTH_OK = API.requireRole();

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['spas','bookings','transactions','customers','owners','settlements','featured','reviews','backups','messages'].forEach(t => document.getElementById('tab-'+t).style.display = t === name ? 'block' : 'none');
  if (name === 'bookings') loadBookings();
  if (name === 'transactions') loadTransactions();
  if (name === 'customers') loadCustomers();
  if (name === 'owners') loadOwners();
  if (name === 'messages') loadMessages();
  if (name === 'settlements') loadSettlements();
  if (name === 'featured') loadFeaturedAdmin();
  if (name === 'reviews') loadReviewAdmin();
  if (name === 'backups') loadBackups();
}

function closeDetailModal() { document.getElementById('detailModal').classList.remove('open'); }

async function loadStats() {
  try {
    const s = await API.get('/admin/stats');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="num">🏢 ${s.totalSpas}</div><div class="label">Total spas</div></div>
      <div class="stat-card"><div class="num">⏳ ${s.pendingSpas}</div><div class="label">Pending review</div></div>
      <div class="stat-card"><div class="num">🙋 ${s.totalCustomers}</div><div class="label">Customers</div></div>
      <div class="stat-card"><div class="num">🧑‍💼 ${s.totalOwners}</div><div class="label">Spa owners</div></div>
      <div class="stat-card"><div class="num">📅 ${s.totalBookings}</div><div class="label">Total bookings</div></div>
      <div class="stat-card"><div class="num">✅ ${s.confirmedBookings}</div><div class="label">Confirmed</div></div>
      <div class="stat-card"><div class="num">💰 ${money(s.revenue)}</div><div class="label">Revenue collected</div></div>
      <div class="stat-card"><div class="num">🏦 ${money(s.commissionEarned)}</div><div class="label">Commission earned</div></div>
      <div class="stat-card"><div class="num">🎁 ${money(s.giftCardLiability + s.packageLiability)}</div><div class="label">Unused gift cards &amp; packages (owed as service)</div></div>
      <div class="stat-card"><div class="num">⭐ ${money(s.featuredRevenue)}</div><div class="label">Featured revenue · ${s.activeFeatured} live</div></div>
      <div class="stat-card"><div class="num">✉️ ${s.newMessages}</div><div class="label">New messages</div></div>
    `;
    const b = s.backup || {}, ban = document.getElementById('backupBanner');
    const warn = (bg, border, html) => `<div class="panel" style="margin-top:18px;padding:14px 18px;background:${bg};border-color:${border};cursor:pointer" onclick="switchTab('backups')">${html}</div>`;
    ban.innerHTML = b.restoreError ? warn('#F3DEDD', '#A03A34', `<strong>⚠️ Database restore failed:</strong> ${esc(b.restoreError)}`)
      : (b.ageHours === null || b.ageHours > 36 || b.lastError) ? warn('#F3DEDD', '#A03A34', `<strong>⚠️ No recent automatic backup.</strong> ${b.lastError ? esc(b.lastError) : 'Open the Backups tab and click “Back up now”.'}`)
      : b.lastOffsiteError ? warn('#F5E9D2', 'var(--gold)', `<strong>⚠️ Offsite backup is failing:</strong> ${esc(b.lastOffsiteError)}`)
      : !b.offsite ? warn('#F5E9D2', 'var(--gold)', `<strong>💾 Backups are kept on your server volume only.</strong> Set up a free offsite copy so you’re protected even if the volume is lost → <u>Backups tab</u>`) : '';
    const badge = document.getElementById('msgBadge');
    badge.innerHTML = s.newMessages > 0 ? `<span class="badge pending" style="margin-left:2px">${s.newMessages}</span>` : '';
  } catch (e) { toast(e.message, 'error'); }
}

function statusBadge(s) {
  const labels = { pending: 'Pending review', approved: 'Live', rejected: 'Rejected' };
  return `<span class="badge ${s}">${labels[s]}</span>`;
}

async function loadSpas() {
  const el = document.getElementById('spaList');
  try {
    const { spas } = await API.get('/admin/spas');
    if (!spas.length) { el.innerHTML = `<p class="helper-text">No spas listed yet.</p>`; return; }
    el.innerHTML = spas.map(s => `
      <div class="panel" style="margin-bottom:14px;cursor:pointer" onclick="openSpaDetail(${s.id})">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
          <div>
            <span class="mono helper-text" style="margin:0">ID #${s.id}</span>
            <h3 style="margin:2px 0 4px">${s.cover_emoji} ${s.name}</h3>
            <div class="helper-text">${s.city} ${s.address ? '· ' + s.address : ''} · Owner: ${s.owner_name} (${s.owner_email})</div>
          </div>
          ${statusBadge(s.status)}
        </div>
        <p style="font-size:14px;color:var(--ink-soft);margin:10px 0">${s.description || ''}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap" onclick="event.stopPropagation()">
          ${s.status !== 'approved' ? `<button class="btn small gold" onclick="setSpaStatus(${s.id},'approved')">Approve</button>` : ''}
          ${s.status !== 'rejected' ? `<button class="btn small outline" onclick="setSpaStatus(${s.id},'rejected')">Reject</button>` : ''}
          ${s.status !== 'pending' ? `<button class="btn small outline" onclick="setSpaStatus(${s.id},'pending')">Set pending</button>` : ''}
          <button class="btn small outline" onclick="openSpaDetail(${s.id})">View full details</button>
        </div>
      </div>
    `).join('');
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function setSpaStatus(id, status) {
  try {
    await API.put(`/admin/spas/${id}/status`, { status });
    toast('Spa status updated.');
    loadSpas(); loadStats();
  } catch (e) { toast(e.message, 'error'); }
}

async function openSpaDetail(id) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailModalBody');
  body.innerHTML = '<p>Loading…</p>';
  modal.classList.add('open');
  try {
    const d = await API.get(`/admin/spas/${id}`);
    const s = d.spa;
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <span class="mono helper-text" style="margin:0">Spa ID #${s.id}</span>
          <h2 style="margin:2px 0 6px">${s.cover_emoji} ${s.name}</h2>
        </div>
        <button class="btn small outline" onclick="closeDetailModal()">Close</button>
      </div>
      ${statusBadge(s.status)}${s.suspended ? ' <span class="badge cancelled">Hidden — owner deactivated</span>' : ''}
      <button class="btn small outline" style="margin-left:8px" onclick="editSpaAdmin(${s.id})">Edit details</button>
      <hr class="divider-line">
      <p style="font-size:14px;color:var(--ink-soft)">${s.description || ''}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13.5px;margin:14px 0">
        <div><strong>City</strong><br>${s.city}</div>
        <div><strong>Address</strong><br>${s.address || '—'}</div>
        <div><strong>Hours</strong><br>${formatTime(s.opening_time)} – ${formatTime(s.closing_time)}</div>
        <div><strong>Rating</strong><br>${s.rating_count ? '★ ' + Number(s.rating_avg).toFixed(1) + ' (' + s.rating_count + ' reviews)' : 'No reviews yet'}</div>
        <div><strong>Location</strong><br>${s.latitude ? `<a href="https://www.google.com/maps?q=${s.latitude},${s.longitude}" target="_blank" style="color:var(--moss);font-weight:600">View on map</a>` : 'Not set'}</div>
        <div><strong>Photos/videos</strong><br>${d.mediaCount} uploaded</div>
      </div>
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Owner</h4>
      <p style="font-size:13.5px;color:var(--ink-soft)">${s.owner_name} · ${s.owner_email} · ${s.owner_phone || 'no phone'}</p>
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Rooms &amp; capacity (${d.roomTypes.length})</h4>
      ${d.roomTypes.length ? d.roomTypes.map(rt => `<p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0">🛏️ ${rt.name} — ${rt.capacity} room${rt.capacity!==1?'s':''}</p>`).join('') : '<p class="helper-text">None defined.</p>'}
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Services (${d.services.length})</h4>
      ${d.services.map(sv => `<p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0">${sv.name} — ${money(sv.price)}${sv.discount_percent > 0 ? ` (${sv.discount_percent}% off)` : ''} ${sv.active ? '' : '<span class="badge cancelled">removed</span>'}</p>`).join('') || '<p class="helper-text">None yet.</p>'}
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Coupons (${d.coupons.length})</h4>
      ${d.coupons.map(c => `<p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0" class="mono">${c.code} — ${c.discount_type === 'percent' ? c.discount_value+'%' : money(c.discount_value)} off ${c.active ? '' : '(disabled)'}</p>`).join('') || '<p class="helper-text">None yet.</p>'}
      <hr class="divider-line">
      <div class="stat-grid" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="num">${d.totalBookings}</div><div class="label">Total bookings</div></div>
        <div class="stat-card"><div class="num">${money(d.revenue)}</div><div class="label">Revenue</div></div>
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<p>${e.message}</p><button class="btn small outline" onclick="closeDetailModal()">Close</button>`;
  }
}

const statusLabel = { pending_payment: 'Awaiting payment', confirmed: 'Confirmed', cancelled: 'Cancelled', completed: 'Completed' };

async function loadBookings() {
  const el = document.getElementById('bookingList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const q = (document.getElementById('bookingSearch').value || '').trim();
    const { bookings } = await API.get('/admin/bookings' + (q ? '?q=' + encodeURIComponent(q) : ''));
    if (!bookings.length) { el.innerHTML = `<p class="helper-text">${q ? 'No bookings match your search.' : 'No bookings yet.'}</p>`; return; }
    const th = 'style="padding:10px 14px;white-space:nowrap"', td = 'style="padding:10px 14px"';
    el.innerHTML = `
      <div class="panel" style="padding:0;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="background:var(--stone-dark);text-align:left">
            <th ${th}>Booking ID</th><th ${th}>Customer</th><th ${th}>Spa</th><th ${th}>Service</th>
            <th ${th}>Appointment</th><th ${th}>Amount</th><th ${th}>Payment</th><th ${th}>Status</th>
          </tr></thead>
          <tbody>
            ${bookings.map(b => `
              <tr style="border-top:1px solid var(--line)">
                <td ${td} class="mono"><strong>${esc(b.booking_ref || '#' + b.id)}</strong><div class="helper-text" style="margin:0">booked ${formatDate(b.created_at)}</div></td>
                <td ${td}>${esc(b.customer_name)}<div class="helper-text" style="margin:0">${esc(b.customer_phone || '')}</div></td>
                <td ${td}>${esc(b.spa_name)}</td>
                <td ${td}>${esc(b.service_name)}</td>
                <td ${td}>${formatDate(b.booking_date)} ${formatTime(b.start_time)}</td>
                <td ${td} class="mono">${money(b.amount)}</td>
                <td ${td}>${b.payment_mode === 'pay_at_venue' ? '🏢 At spa' : '💳 Online'} ${b.payment_status === 'paid' ? '✅' : b.payment_status === 'refunded' ? '↩️' : '⏳'}</td>
                <td ${td}><span class="badge ${b.status}">${b.cancel_reason === 'no_show' ? 'No-show' : statusLabel[b.status]}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
}

async function loadTransactions() {
  const el = document.getElementById('transactionList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { transactions, totalRevenue } = await API.get('/admin/transactions');
    const summary = `<div class="stat-card" style="max-width:260px;margin-bottom:16px"><div class="num">${money(totalRevenue)}</div><div class="label">Total successful revenue</div></div>`;
    if (!transactions.length) { el.innerHTML = summary + `<p class="helper-text">No transactions yet.</p>`; return; }
    el.innerHTML = summary + `
      <div class="panel" style="padding:0;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="background:var(--stone-dark);text-align:left">
            <th style="padding:10px 14px">Txn ID</th><th style="padding:10px 14px">Booking ID</th><th style="padding:10px 14px">Date</th><th style="padding:10px 14px">Customer</th>
            <th style="padding:10px 14px">Spa</th><th style="padding:10px 14px">Amount</th><th style="padding:10px 14px">Method</th>
            <th style="padding:10px 14px">Reference</th><th style="padding:10px 14px">Status</th>
          </tr></thead>
          <tbody>
            ${transactions.map(t => `
              <tr style="border-top:1px solid var(--line)">
                <td style="padding:10px 14px" class="mono helper-text">#${t.id}</td>
                <td style="padding:10px 14px" class="mono">${esc(t.booking_ref || '—')}</td>
                <td style="padding:10px 14px">${formatDate(t.booking_date)}</td>
                <td style="padding:10px 14px">${t.customer_name}</td>
                <td style="padding:10px 14px">${t.spa_name}</td>
                <td style="padding:10px 14px" class="mono">${money(t.amount)}</td>
                <td style="padding:10px 14px;text-transform:capitalize">${t.method}</td>
                <td style="padding:10px 14px" class="mono helper-text">${t.transaction_ref}</td>
                <td style="padding:10px 14px"><span class="badge ${t.status === 'success' ? 'confirmed' : 'cancelled'}">${t.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

function userTable(users, cols, empty) {
  const th = 'style="padding:10px 14px;white-space:nowrap"', td = 'style="padding:10px 14px;vertical-align:top"';
  if (!users.length) return `<p class="helper-text">${empty}</p>`;
  return `<div class="panel" style="padding:0;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px">
    <thead><tr style="background:var(--stone-dark);text-align:left">${cols.map(c => `<th ${th}>${c[0]}</th>`).join('')}<th ${th}></th></tr></thead>
    <tbody>${users.map(u => `<tr style="border-top:1px solid var(--line);cursor:pointer" onclick="openUserDetail(${u.id})">
      ${cols.map(c => `<td ${td}>${c[1](u)}</td>`).join('')}
      <td ${td}><button class="btn small outline" onclick="event.stopPropagation();openUserDetail(${u.id})">View</button></td></tr>`).join('')}</tbody></table></div>`;
}
function matches(u, q, extra = '') { return !q || [u.name, u.email, u.phone, extra].some(v => String(v || '').toLowerCase().includes(q)); }
async function loadCustomers() {
  const el = document.getElementById('customerList');
  try {
    const { users } = await API.get('/admin/users?role=customer');
    const q = (document.getElementById('custSearch').value || '').trim().toLowerCase();
    const list = users.filter(u => matches(u, q));
    el.innerHTML = `<p class="helper-text">${users.length} customer${users.length !== 1 ? 's' : ''}${q ? ` · ${list.length} matching` : ''}</p>` + userTable(list, [
      ['ID', u => `<span class="mono helper-text">#${u.id}</span>`],
      ['Name', u => esc(u.name) + (u.active === 0 ? ' <span class="badge cancelled">Deactivated</span>' : '')],
      ['Contact', u => `${esc(u.email)}<div class="helper-text" style="margin:0">${esc(u.phone || '—')} ${u.phone_verified ? '✅' : ''}</div>`],
      ['Bookings', u => u.booking_count],
      ['Total spent', u => `<span class="mono">${money(u.total_spent)}</span>`],
      ['Last booking', u => u.last_booking ? formatDate(u.last_booking) : '—'],
      ['Joined', u => formatDate(u.created_at)],
    ], q ? 'No customers match your search.' : 'No customers yet.');
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
}
async function loadOwners() {
  const el = document.getElementById('ownerList');
  try {
    const { users } = await API.get('/admin/users?role=owner');
    const q = (document.getElementById('ownerSearch').value || '').trim().toLowerCase();
    const list = users.filter(u => matches(u, q, u.spa_names));
    el.innerHTML = `<p class="helper-text">${users.length} spa owner${users.length !== 1 ? 's' : ''}${q ? ` · ${list.length} matching` : ''}</p>` + userTable(list, [
      ['ID', u => `<span class="mono helper-text">#${u.id}</span>`],
      ['Name', u => esc(u.name) + (u.active === 0 ? ' <span class="badge cancelled">Deactivated</span>' : '')],
      ['Contact', u => `${esc(u.email)}<div class="helper-text" style="margin:0">${esc(u.phone || '—')} ${u.phone_verified ? '✅' : ''}</div>`],
      ['Spas', u => `${u.spa_count} total · ${u.live_spas || 0} live${u.pending_spas ? ` · <span class="badge pending">${u.pending_spas} pending</span>` : ''}<div class="helper-text" style="margin:0">${esc(u.spa_names || '')}</div>`],
      ['Joined', u => formatDate(u.created_at)],
    ], q ? 'No owners match your search.' : 'No spa owners yet.');
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
}
async function downloadBackup() {
  const btn = document.getElementById('backupBtn'); btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const res = await fetch('/api/admin/backup', { headers: { Authorization: 'Bearer ' + API.token() } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Backup failed.');
    const blob = await res.blob();
    const name = (res.headers.get('Content-Disposition') || '').match(/filename="(.+?)"/)?.[1] || 'bookmyspa-backup.db';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Backup downloaded. Keep it somewhere safe — it contains customer data.');
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '⬇ Download backup'; }
}

async function openUserDetail(id) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailModalBody');
  body.innerHTML = '<p>Loading…</p>';
  modal.classList.add('open');
  try {
    const d = await API.get(`/admin/users/${id}`);
    const u = d.user;
    let extra = '';
    if (u.role === 'customer') {
      extra = `
        <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin:14px 0">
          <div class="stat-card"><div class="num">${d.totalBookings}</div><div class="label">Total bookings</div></div>
          <div class="stat-card"><div class="num">${money(d.totalSpent)}</div><div class="label">Total spent</div></div>
        </div>
        <h4 style="margin-bottom:6px">Booking history</h4>
        ${d.bookings.length ? d.bookings.map(b => `
          <div class="service-row">
            <div><h4 style="font-size:14px">${b.service_name}</h4><div class="desc">${b.spa_name} · ${formatDate(b.booking_date)}</div></div>

async function recordSettlement(spaId, net) {

const kindLabel = { daily: 'Nightly', manual: 'Manual', 'pre-update': 'Before an update', 'before-restore': 'Before a restore' };
function fmtBytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function ago(iso) { if (!iso) return 'never'; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 2 ? 'just now' : m < 120 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + ' hours ago' : Math.round(m / 1440) + ' days ago'; }
async function loadBackups() {
  const el = document.getElementById('backupPanel');
  try {
    const { backups, status, offsite } = await API.get('/admin/backups');
    const th = 'style="padding:10px 14px"';
    el.innerHTML = `
      <div class="two-col">
        <div class="panel">
          <h3>Automatic backups</h3>
          <p class="helper-text" style="line-height:1.7;margin-bottom:12px">
            ✅ A snapshot is taken <strong>automatically before every update</strong>, and a full backup <strong>every night (~3 am IST)</strong>. Each one is integrity-checked. Last backup: <strong>${ago(status.lastLocal && status.lastLocal.at)}</strong>.
          </p>
          <button class="btn gold" id="bkNow" onclick="backupNow()">Back up now</button>
          <button class="btn outline" onclick="downloadBackup()" style="margin-left:6px">⬇ Download a fresh copy</button>
        </div>
        <div class="panel">
          <h3>Offsite copy ${offsite.configured ? '<span class="badge confirmed">ON</span>' : '<span class="badge pending">not set up</span>'}</h3>
          ${offsite.configured
            ? `<p class="helper-text" style="line-height:1.7">Every backup is also uploaded to <strong>${esc(offsite.host)}</strong> / <span class="mono">${esc(offsite.bucket)}</span>.<br>Last upload: <strong>${ago(status.lastOffsite && status.lastOffsite.at)}</strong>${status.lastOffsiteError ? `<br><span style="color:#A03A34">Last error: ${esc(status.lastOffsiteError.message)}</span>` : ''}</p>`
            : `<p class="helper-text" style="line-height:1.7">Backups currently live on the same Railway volume as your data. If that volume were ever deleted, the backups would go with it. Add the free <span class="mono">BACKUP_S3_*</span> settings (see README → “Offsite backups”) to also copy every backup to Cloudflare R2 or Backblaze B2.</p>`}
        </div>
      </div>
      <h3 style="margin:22px 0 10px">Saved backups (${backups.length})</h3>
      ${backups.length ? `<div class="panel" style="padding:0;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px">
        <thead><tr style="background:var(--stone-dark);text-align:left"><th ${th}>File</th><th ${th}>Type</th><th ${th}>Size</th><th ${th}>Taken</th><th ${th}></th></tr></thead>
        <tbody>${backups.map(b => `<tr style="border-top:1px solid var(--line)">
          <td ${th} class="mono">${esc(b.name)}</td><td ${th}>${kindLabel[b.kind] || b.kind}</td><td ${th}>${fmtBytes(b.size)}</td><td ${th}>${ago(b.created)}</td>
          <td ${th}><button class="btn small outline" onclick="downloadBackupFile('${esc(b.name)}')">Download</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="helper-text">No backups yet — the first one is created automatically shortly after the server starts.</p>'}
      <div class="panel" style="margin-top:18px"><h4 style="margin-bottom:6px">Need to restore?</h4>
        <p class="helper-text" style="margin:0;line-height:1.7">In Railway → Variables add <span class="mono">RESTORE_BACKUP</span> = a file name from the list above (or <span class="mono">RESTORE_OFFSITE_KEY</span> for an offsite copy), redeploy, then <strong>delete the variable</strong>. Your current data is saved as a “before a restore” backup first, so a restore can itself be undone. Photos are not part of database backups.</p>
      </div>`;
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
}
async function backupNow() {
  const btn = document.getElementById('bkNow'); btn.disabled = true; btn.textContent = 'Backing up…';
  try { const r = await API.post('/admin/backups'); toast(r.message); loadBackups(); loadStats(); }
  catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Back up now'; }
}
async function downloadBackupFile(name) {
  try {
    const res = await fetch('/api/admin/backups/' + encodeURIComponent(name), { headers: { Authorization: 'Bearer ' + API.token() } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Download failed.');
    const blob = await res.blob();
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Downloaded. Keep it private — it contains customer data.');
  } catch (e) { toast(e.message, 'error'); }
}

    <label for="as_addr">Address</label><input id="as_addr" value="${esc(s.address || '')}">
    <div class="form-row"><div><label for="as_open">Opens</label><input type="time" id="as_open" value="${s.opening_time}"></div><div><label for="as_close">Closes</label><input type="time" id="as_close" value="${s.closing_time}"></div></div>
    <div style="display:flex;gap:10px;margin-top:14px"><button class="btn outline block" onclick="openSpaDetail(${id})">Cancel</button><button class="btn gold block" onclick="saveSpaAdmin(${id})">Save</button></div>`;
}
async function saveSpaAdmin(id) {
  const g = k => document.getElementById(k).value.trim();
  try { const r = await API.put(`/admin/spas/${id}`, { name: g('as_name'), description: g('as_desc'), city: g('as_city'), phone: g('as_phone'), address: g('as_addr'), opening_time: g('as_open'), closing_time: g('as_close') });
    toast(r.message); openSpaDetail(id); loadSpas(); } catch (e) { toast(e.message, 'error'); }
}

const messageStatusLabel = { new: 'New', read: 'Read', resolved: 'Resolved' };

async function loadMessages() {
  const el = document.getElementById('messageList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { messages } = await API.get('/admin/messages');
    if (!messages.length) { el.innerHTML = `<div class="empty-state"><div class="big">📭</div><p>No messages yet.</p></div>`; return; }
    el.innerHTML = messages.map(m => `
      <div class="panel" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
          <div>
            <h4 style="margin-bottom:2px">${m.subject || '(No subject)'}</h4>
            <div class="helper-text">${m.name} · ${m.email} · ${formatDate(m.created_at.slice(0,10))}</div>
          </div>
          <span class="badge ${m.status === 'new' ? 'pending' : m.status === 'resolved' ? 'confirmed' : 'approved'}">${messageStatusLabel[m.status]}</span>
        </div>
        <p style="font-size:14px;color:var(--ink-soft);margin:10px 0;white-space:pre-wrap">${m.message}</p>
        <div style="display:flex;gap:8px">
          ${m.status !== 'read' ? `<button class="btn small outline" onclick="setMessageStatus(${m.id},'read')">Mark read</button>` : ''}
          ${m.status !== 'resolved' ? `<button class="btn small gold" onclick="setMessageStatus(${m.id},'resolved')">Mark resolved</button>` : ''}
          <a class="btn small outline" href="mailto:${m.email}">Reply by email</a>
        </div>
      </div>
    `).join('');
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function setMessageStatus(id, status) {
  try {
    await API.put(`/admin/messages/${id}`, { status });
    loadMessages(); loadStats();
  } catch (e) { toast(e.message, 'error'); }
}

if (AUTH_OK) { loadStats(); loadSpas(); }
</script>
</body>
</html>
