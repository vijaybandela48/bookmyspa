<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel — BookMySpa</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>
<div class="wrap page-body">
  <div class="eyebrow">Platform admin</div>
  <h1 style="margin-top:4px">Admin panel</h1>

  <div class="stat-grid" id="stats" style="margin-top:24px"></div>

  <div class="tabs">
    <div class="tab active" data-tab="spas" onclick="switchTab('spas')">🏢 Spas</div>
    <div class="tab" data-tab="bookings" onclick="switchTab('bookings')">📅 Bookings</div>
    <div class="tab" data-tab="transactions" onclick="switchTab('transactions')">💳 Transactions</div>
    <div class="tab" data-tab="users" onclick="switchTab('users')">👤 Customers &amp; owners</div>
    <div class="tab" data-tab="settlements" onclick="switchTab('settlements')">💸 Commission &amp; payouts</div>
    <div class="tab" data-tab="messages" onclick="switchTab('messages')">✉️ Messages <span id="msgBadge"></span></div>
  </div>

  <div id="tab-spas"><div id="spaList"><p>Loading…</p></div></div>
  <div id="tab-bookings" style="display:none"><div id="bookingList"><p>Loading…</p></div></div>
  <div id="tab-transactions" style="display:none"><div id="transactionList"><p>Loading…</p></div></div>
  <div id="tab-users" style="display:none"><div id="userList"><p>Loading…</p></div></div>
  <div id="tab-settlements" style="display:none"><div id="settlementList"><p>Loading…</p></div></div>
  <div id="tab-messages" style="display:none"><div id="messageList"><p>Loading…</p></div></div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:640px;max-height:85vh;overflow-y:auto">
    <div id="detailModalBody"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
renderNav('admin');
const AUTH_OK = API.requireRole();

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['spas','bookings','transactions','users','settlements','messages'].forEach(t => document.getElementById('tab-'+t).style.display = t === name ? 'block' : 'none');
  if (name === 'bookings') loadBookings();
  if (name === 'transactions') loadTransactions();
  if (name === 'users') loadUsers();
  if (name === 'messages') loadMessages();
  if (name === 'settlements') loadSettlements();
}

function closeDetailModal() { document.getElementById('detailModal').classList.remove('open'); }

async function loadStats() {
  try {
    const s = await API.get('/admin/stats');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="num">🏢 ${s.totalSpas}</div><div class="label">Total spas</div></div>
      <div class="stat-card"><div class="num">⏳ ${s.pendingSpas}</div><div class="label">Pending review</div></div>
      <div class="stat-card"><div class="num">🙋 ${s.totalCustomers}</div><div class="label">Customers</div></div>
      <div class="stat-card"><div class="num">🧑‍💼 ${s.totalOwners}</div><div class="label">Spa owners</div></div>
      <div class="stat-card"><div class="num">📅 ${s.totalBookings}</div><div class="label">Total bookings</div></div>
      <div class="stat-card"><div class="num">✅ ${s.confirmedBookings}</div><div class="label">Confirmed</div></div>
      <div class="stat-card"><div class="num">💰 ${money(s.revenue)}</div><div class="label">Revenue collected</div></div>
      <div class="stat-card"><div class="num">🏦 ${money(s.commissionEarned)}</div><div class="label">Commission earned</div></div>
      <div class="stat-card"><div class="num">✉️ ${s.newMessages}</div><div class="label">New messages</div></div>
    `;
    const badge = document.getElementById('msgBadge');
    badge.innerHTML = s.newMessages > 0 ? `<span class="badge pending" style="margin-left:2px">${s.newMessages}</span>` : '';
  } catch (e) { toast(e.message, 'error'); }
}

function statusBadge(s) {
  const labels = { pending: 'Pending review', approved: 'Live', rejected: 'Rejected' };
  return `<span class="badge ${s}">${labels[s]}</span>`;
}

async function loadSpas() {
  const el = document.getElementById('spaList');
  try {
    const { spas } = await API.get('/admin/spas');
    if (!spas.length) { el.innerHTML = `<p class="helper-text">No spas listed yet.</p>`; return; }
    el.innerHTML = spas.map(s => `
      <div class="panel" style="margin-bottom:14px;cursor:pointer" onclick="openSpaDetail(${s.id})">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
          <div>
            <span class="mono helper-text" style="margin:0">ID #${s.id}</span>
            <h3 style="margin:2px 0 4px">${s.cover_emoji} ${s.name}</h3>
            <div class="helper-text">${s.city} ${s.address ? '· ' + s.address : ''} · Owner: ${s.owner_name} (${s.owner_email})</div>
          </div>
          ${statusBadge(s.status)}
        </div>
        <p style="font-size:14px;color:var(--ink-soft);margin:10px 0">${s.description || ''}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap" onclick="event.stopPropagation()">
          ${s.status !== 'approved' ? `<button class="btn small gold" onclick="setSpaStatus(${s.id},'approved')">Approve</button>` : ''}
          ${s.status !== 'rejected' ? `<button class="btn small outline" onclick="setSpaStatus(${s.id},'rejected')">Reject</button>` : ''}
          ${s.status !== 'pending' ? `<button class="btn small outline" onclick="setSpaStatus(${s.id},'pending')">Set pending</button>` : ''}
          <button class="btn small outline" onclick="openSpaDetail(${s.id})">View full details</button>
        </div>
      </div>
    `).join('');
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function setSpaStatus(id, status) {
  try {
    await API.put(`/admin/spas/${id}/status`, { status });
    toast('Spa status updated.');
    loadSpas(); loadStats();
  } catch (e) { toast(e.message, 'error'); }
}

async function openSpaDetail(id) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailModalBody');
  body.innerHTML = '<p>Loading…</p>';
  modal.classList.add('open');
  try {
    const d = await API.get(`/admin/spas/${id}`);
    const s = d.spa;
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <span class="mono helper-text" style="margin:0">Spa ID #${s.id}</span>
          <h2 style="margin:2px 0 6px">${s.cover_emoji} ${s.name}</h2>
        </div>
        <button class="btn small outline" onclick="closeDetailModal()">Close</button>
      </div>
      ${statusBadge(s.status)}
      <hr class="divider-line">
      <p style="font-size:14px;color:var(--ink-soft)">${s.description || ''}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13.5px;margin:14px 0">
        <div><strong>City</strong><br>${s.city}</div>
        <div><strong>Address</strong><br>${s.address || '—'}</div>
        <div><strong>Hours</strong><br>${formatTime(s.opening_time)} – ${formatTime(s.closing_time)}</div>
        <div><strong>Rating</strong><br>★ ${Math.round(s.rating*10)/10}</div>
        <div><strong>Location</strong><br>${s.latitude ? `<a href="https://www.google.com/maps?q=${s.latitude},${s.longitude}" target="_blank" style="color:var(--moss);font-weight:600">View on map</a>` : 'Not set'}</div>
        <div><strong>Photos/videos</strong><br>${d.mediaCount} uploaded</div>
      </div>
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Owner</h4>
      <p style="font-size:13.5px;color:var(--ink-soft)">${s.owner_name} · ${s.owner_email} · ${s.owner_phone || 'no phone'}</p>
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Rooms &amp; capacity (${d.roomTypes.length})</h4>
      ${d.roomTypes.length ? d.roomTypes.map(rt => `<p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0">🛏️ ${rt.name} — ${rt.capacity} room${rt.capacity!==1?'s':''}</p>`).join('') : '<p class="helper-text">None defined.</p>'}
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Services (${d.services.length})</h4>
      ${d.services.map(sv => `<p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0">${sv.name} — ${money(sv.price)}${sv.discount_percent > 0 ? ` (${sv.discount_percent}% off)` : ''} ${sv.active ? '' : '<span class="badge cancelled">removed</span>'}</p>`).join('') || '<p class="helper-text">None yet.</p>'}
      <hr class="divider-line">
      <h4 style="margin-bottom:6px">Coupons (${d.coupons.length})</h4>
      ${d.coupons.map(c => `<p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0" class="mono">${c.code} — ${c.discount_type === 'percent' ? c.discount_value+'%' : money(c.discount_value)} off ${c.active ? '' : '(disabled)'}</p>`).join('') || '<p class="helper-text">None yet.</p>'}
      <hr class="divider-line">
      <div class="stat-grid" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="num">${d.totalBookings}</div><div class="label">Total bookings</div></div>
        <div class="stat-card"><div class="num">${money(d.revenue)}</div><div class="label">Revenue</div></div>
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<p>${e.message}</p><button class="btn small outline" onclick="closeDetailModal()">Close</button>`;
  }
}

const statusLabel = { pending_payment: 'Awaiting payment', confirmed: 'Confirmed', cancelled: 'Cancelled', completed: 'Completed' };

async function loadBookings() {
  const el = document.getElementById('bookingList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { bookings } = await API.get('/admin/bookings');
    if (!bookings.length) { el.innerHTML = `<p class="helper-text">No bookings yet.</p>`; return; }
    el.innerHTML = `
      <div class="panel" style="padding:0;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="background:var(--stone-dark);text-align:left">
            <th style="padding:10px 14px">ID</th><th style="padding:10px 14px">Customer</th><th style="padding:10px 14px">Spa</th><th style="padding:10px 14px">Service</th>
            <th style="padding:10px 14px">Date</th><th style="padding:10px 14px">Amount</th><th style="padding:10px 14px">Payment</th><th style="padding:10px 14px">Status</th>
          </tr></thead>
          <tbody>
            ${bookings.map(b => `
              <tr style="border-top:1px solid var(--line)">
                <td style="padding:10px 14px" class="mono helper-text">#${b.id}</td>
                <td style="padding:10px 14px">${b.customer_name}</td>
                <td style="padding:10px 14px">${b.spa_name}</td>
                <td style="padding:10px 14px">${b.service_name}</td>
                <td style="padding:10px 14px">${formatDate(b.booking_date)} ${formatTime(b.start_time)}</td>
                <td style="padding:10px 14px" class="mono">${money(b.amount)}</td>
                <td style="padding:10px 14px">${b.payment_mode === 'pay_at_venue' ? '🏢 At spa' : '💳 Online'} ${b.payment_status === 'paid' ? '✅' : b.payment_status === 'refunded' ? '↩️' : '⏳'}</td>
                <td style="padding:10px 14px"><span class="badge ${b.status}">${statusLabel[b.status]}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function loadTransactions() {
  const el = document.getElementById('transactionList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { transactions, totalRevenue } = await API.get('/admin/transactions');
    const summary = `<div class="stat-card" style="max-width:260px;margin-bottom:16px"><div class="num">${money(totalRevenue)}</div><div class="label">Total successful revenue</div></div>`;
    if (!transactions.length) { el.innerHTML = summary + `<p class="helper-text">No transactions yet.</p>`; return; }
    el.innerHTML = summary + `
      <div class="panel" style="padding:0;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="background:var(--stone-dark);text-align:left">
            <th style="padding:10px 14px">Txn ID</th><th style="padding:10px 14px">Date</th><th style="padding:10px 14px">Customer</th>
            <th style="padding:10px 14px">Spa</th><th style="padding:10px 14px">Amount</th><th style="padding:10px 14px">Method</th>
            <th style="padding:10px 14px">Reference</th><th style="padding:10px 14px">Status</th>
          </tr></thead>
          <tbody>
            ${transactions.map(t => `
              <tr style="border-top:1px solid var(--line)">
                <td style="padding:10px 14px" class="mono helper-text">#${t.id}</td>
                <td style="padding:10px 14px">${formatDate(t.booking_date)}</td>
                <td style="padding:10px 14px">${t.customer_name}</td>
                <td style="padding:10px 14px">${t.spa_name}</td>
                <td style="padding:10px 14px" class="mono">${money(t.amount)}</td>
                <td style="padding:10px 14px;text-transform:capitalize">${t.method}</td>
                <td style="padding:10px 14px" class="mono helper-text">${t.transaction_ref}</td>
                <td style="padding:10px 14px"><span class="badge ${t.status === 'success' ? 'confirmed' : 'cancelled'}">${t.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function loadUsers() {
  const el = document.getElementById('userList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { users } = await API.get('/admin/users');
    el.innerHTML = `
      <div class="panel" style="padding:0;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="background:var(--stone-dark);text-align:left">
            <th style="padding:10px 14px">ID</th><th style="padding:10px 14px">Name</th><th style="padding:10px 14px">Email</th>
            <th style="padding:10px 14px">Phone</th><th style="padding:10px 14px">Role</th><th style="padding:10px 14px">Joined</th><th></th>
          </tr></thead>
          <tbody>
            ${users.map(u => `
              <tr style="border-top:1px solid var(--line);cursor:pointer" onclick="openUserDetail(${u.id})">
                <td style="padding:10px 14px" class="mono helper-text">#${u.id}</td>
                <td style="padding:10px 14px">${u.name}</td>
                <td style="padding:10px 14px">${u.email}</td>
                <td style="padding:10px 14px">${u.phone || '—'} ${u.phone_verified ? '✅' : ''}</td>
                <td style="padding:10px 14px"><span class="badge approved" style="text-transform:capitalize">${u.role}</span></td>
                <td style="padding:10px 14px" class="helper-text">${formatDate(u.created_at.slice(0,10))}</td>
                <td style="padding:10px 14px"><button class="btn small outline" onclick="event.stopPropagation();openUserDetail(${u.id})">View</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function openUserDetail(id) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailModalBody');
  body.innerHTML = '<p>Loading…</p>';
  modal.classList.add('open');
  try {
    const d = await API.get(`/admin/users/${id}`);
    const u = d.user;
    let extra = '';
    if (u.role === 'customer') {
      extra = `
        <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin:14px 0">
          <div class="stat-card"><div class="num">${d.totalBookings}</div><div class="label">Total bookings</div></div>
          <div class="stat-card"><div class="num">${money(d.totalSpent)}</div><div class="label">Total spent</div></div>
        </div>
        <h4 style="margin-bottom:6px">Booking history</h4>
        ${d.bookings.length ? d.bookings.map(b => `
          <div class="service-row">
            <div><h4 style="font-size:14px">${b.service_name}</h4><div class="desc">${b.spa_name} · ${formatDate(b.booking_date)}</div></div>
            <div style="text-align:right"><div class="price" style="font-size:14px">${money(b.amount)}</div><span class="badge ${b.status}">${statusLabel[b.status]}</span></div>
          </div>
        `).join('') : '<p class="helper-text">No bookings yet.</p>'}
      `;
    } else if (u.role === 'owner') {
      extra = `
        <h4 style="margin-bottom:6px">Spas owned (${d.spas.length})</h4>
        ${d.spas.length ? d.spas.map(s => `
          <div class="service-row">
            <div><h4 style="font-size:14px">${s.cover_emoji} ${s.name}</h4><div class="desc">${s.city}</div></div>
            ${statusBadge(s.status)}
          </div>
        `).join('') : '<p class="helper-text">No spas listed yet.</p>'}
      `;
    }
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <span class="mono helper-text" style="margin:0">User ID #${u.id}</span>
          <h2 style="margin:2px 0 6px">${u.name}</h2>
        </div>
        <button class="btn small outline" onclick="closeDetailModal()">Close</button>
      </div>
      <span class="badge approved" style="text-transform:capitalize">${u.role}</span>
      <div style="font-size:13.5px;color:var(--ink-soft);margin:14px 0">
        <p style="margin:4px 0">✉️ ${u.email}</p>
        <p style="margin:4px 0">📞 ${u.phone || 'Not provided'} ${u.phone_verified ? '<span class="badge confirmed" style="margin-left:4px">Verified</span>' : ''}</p>
        <p style="margin:4px 0">📅 Joined ${formatDate(u.created_at.slice(0,10))}</p>
      </div>
      <hr class="divider-line">
      ${extra}
    `;
  } catch (e) {
    body.innerHTML = `<p>${e.message}</p><button class="btn small outline" onclick="closeDetailModal()">Close</button>`;
  }
}

async function loadSettlements() {
  const el = document.getElementById('settlementList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { spas, history, defaultCommission } = await API.get('/admin/settlements');
    const th = 'style="padding:10px 12px;white-space:nowrap"', td = 'style="padding:10px 12px;vertical-align:top"';
    el.innerHTML = `
      <div class="panel" style="margin-bottom:16px">
        <p class="helper-text" style="margin:0;line-height:1.7">Default commission: <strong>${defaultCommission}%</strong> (set <span class="mono">COMMISSION_PERCENT</span> on the server). Rates are locked onto each booking when it’s made.
        <strong>Net</strong> = online money you hold − commission on it − commission on pay-at-spa bookings the spa collected. Positive: you pay the spa. Negative: the spa pays you.
        Only appointments that have happened are included. Record a settlement after you’ve actually transferred/received the money.</p>
      </div>
      <div class="panel" style="padding:0;overflow:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="background:var(--stone-dark);text-align:left">
            <th ${th}>Spa</th><th ${th}>Rate</th><th ${th}>Pay at spa</th><th ${th}>No-shows (90d)</th><th ${th}>Unsettled</th>
            <th ${th}>Online held</th><th ${th}>Collected at spa</th><th ${th}>Commission</th><th ${th}>Net</th><th ${th}></th>
          </tr></thead>
          <tbody>${spas.map(s => {
            const risky = s.noShow.total >= 5 && s.noShow.rate >= 20;
            return `<tr style="border-top:1px solid var(--line)">
              <td ${td}><strong>${esc(s.spa_name)}</strong><div class="helper-text">${esc(s.owner_name)} · ${esc(s.owner_phone || '')}</div></td>
              <td ${td}>${s.commission_percent}%${s.custom_rate ? ' <span class="badge pending">custom</span>' : ''}<br><button class="btn small outline" style="margin-top:4px" onclick="editRate(${s.spa_id}, ${s.custom_rate ? s.commission_percent : "''"})">Change</button></td>
              <td ${td}>${s.allow_pay_at_venue ? '✅ Allowed' : '⛔ Online only'}<br><button class="btn small outline" style="margin-top:4px" onclick="togglePayAtSpa(${s.spa_id}, ${!s.allow_pay_at_venue})">${s.allow_pay_at_venue ? 'Require online' : 'Allow'}</button></td>
              <td ${td}>${s.noShow.noShows}/${s.noShow.total} (${s.noShow.rate}%) ${risky ? '<span class="badge cancelled">review</span>' : ''}</td>
              <td ${td}>${s.count}</td>
              <td ${td} class="mono">${money(s.onlineGross)}</td>
              <td ${td} class="mono">${money(s.venueGross)}</td>
              <td ${td} class="mono">${money(s.commissionTotal)}</td>
              <td ${td}><strong class="mono">${s.netToSpa > 0 ? 'Pay spa ' + money(s.netToSpa) : s.netToSpa < 0 ? 'Collect ' + money(-s.netToSpa) : '—'}</strong></td>
              <td ${td}>${s.count ? `<button class="btn small gold" onclick="recordSettlement(${s.spa_id}, ${s.netToSpa})">Record settlement</button>` : ''}</td>
            </tr>`; }).join('')}</tbody>
        </table>
      </div>
      <h3 style="margin:24px 0 10px">Settlement history</h3>
      ${history.length ? `<div class="panel" style="padding:0;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px">
        <thead><tr style="background:var(--stone-dark);text-align:left"><th ${th}>#</th><th ${th}>Date</th><th ${th}>Spa</th><th ${th}>Bookings</th><th ${th}>Commission</th><th ${th}>Result</th><th ${th}>Reference</th></tr></thead>
        <tbody>${history.map(h => `<tr style="border-top:1px solid var(--line)">
          <td ${td} class="mono helper-text">#${h.id}</td><td ${td}>${formatDate(h.created_at)}</td><td ${td}>${esc(h.spa_name)}</td><td ${td}>${h.booking_count}</td>
          <td ${td} class="mono">${money(h.commission_total)}</td>
          <td ${td}>${h.direction === 'payout_to_spa' ? 'Paid spa ' + money(h.amount) : h.direction === 'collected_from_spa' ? 'Collected ' + money(h.amount) : 'Nothing owed'}</td>
          <td ${td} class="mono helper-text">${esc(h.reference || '—')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="helper-text">No settlements recorded yet.</p>'}`;
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
}
async function editRate(spaId, current) {
  const v = prompt('Commission % for this spa (0–50). Leave empty to use the platform default.', current);
  if (v === null) return;
  try { const r = await API.put(`/admin/spas/${spaId}/commercials`, { commission_percent: v.trim() === '' ? null : Number(v) }); toast(r.message); loadSettlements(); }
  catch (e) { toast(e.message, 'error'); }
}
async function togglePayAtSpa(spaId, allow) {
  try { await API.put(`/admin/spas/${spaId}/commercials`, { allow_pay_at_venue: allow }); toast(allow ? 'Pay at spa allowed.' : 'This spa now requires online payment.'); loadSettlements(); }
  catch (e) { toast(e.message, 'error'); }
}
async function recordSettlement(spaId, net) {
  const what = net > 0 ? `You are recording that you PAID the spa ${money(net)}.` : net < 0 ? `You are recording that the spa PAID you ${money(-net)}.` : 'Nothing is owed either way; this just closes these bookings.';
  const ref = prompt(what + '\n\nEnter the UTR / UPI / bank reference:', '');
  if (ref === null) return;
  try { const r = await API.post(`/admin/spas/${spaId}/settle`, { reference: ref }); toast(r.message); loadSettlements(); loadStats(); }
  catch (e) { toast(e.message, 'error'); }
}

const messageStatusLabel = { new: 'New', read: 'Read', resolved: 'Resolved' };

async function loadMessages() {
  const el = document.getElementById('messageList');
  el.innerHTML = '<p>Loading…</p>';
  try {
    const { messages } = await API.get('/admin/messages');
    if (!messages.length) { el.innerHTML = `<div class="empty-state"><div class="big">📭</div><p>No messages yet.</p></div>`; return; }
    el.innerHTML = messages.map(m => `
      <div class="panel" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
          <div>
            <h4 style="margin-bottom:2px">${m.subject || '(No subject)'}</h4>
            <div class="helper-text">${m.name} · ${m.email} · ${formatDate(m.created_at.slice(0,10))}</div>
          </div>
          <span class="badge ${m.status === 'new' ? 'pending' : m.status === 'resolved' ? 'confirmed' : 'approved'}">${messageStatusLabel[m.status]}</span>
        </div>
        <p style="font-size:14px;color:var(--ink-soft);margin:10px 0;white-space:pre-wrap">${m.message}</p>
        <div style="display:flex;gap:8px">
          ${m.status !== 'read' ? `<button class="btn small outline" onclick="setMessageStatus(${m.id},'read')">Mark read</button>` : ''}
          ${m.status !== 'resolved' ? `<button class="btn small gold" onclick="setMessageStatus(${m.id},'resolved')">Mark resolved</button>` : ''}
          <a class="btn small outline" href="mailto:${m.email}">Reply by email</a>
        </div>
      </div>
    `).join('');
  } catch (e) { el.innerHTML = `<p>${e.message}</p>`; }
}

async function setMessageStatus(id, status) {
  try {
    await API.put(`/admin/messages/${id}`, { status });
    loadMessages(); loadStats();
  } catch (e) { toast(e.message, 'error'); }
}

if (AUTH_OK) { loadStats(); loadSpas(); }
</script>
