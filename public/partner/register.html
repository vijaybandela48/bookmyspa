<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List your spa — BookMySpa Partners</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>

<div class="wrap auth-wrap">
  <div class="panel">
    <h2>List your spa on BookMySpa</h2>
    <p class="helper-text" style="margin-bottom:6px">Create your partner account. You can add your spa, services, and photos right after — listings go live once our team reviews them.</p>
    <form id="regForm" novalidate>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name" maxlength="80" placeholder="Your name">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" maxlength="120" placeholder="you@example.com">
      <label for="phone">Mobile number</label>
      <div style="display:flex;gap:8px">
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="15" placeholder="10-digit mobile number" oninput="phoneChanged()">
        <button type="button" class="btn small outline" style="white-space:nowrap;display:none" id="sendOtpBtn" onclick="sendOtp()" disabled>Send OTP</button>
      </div>
      <div id="otpBox" style="display:none">
        <label for="otpCode">Verification code</label>
        <input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
        <p class="helper-text" id="otpStatus"></p>
      </div>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" autocomplete="new-password" placeholder="Re-enter password">
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-top:16px">
        <input type="checkbox" id="agree" style="width:auto;margin-top:3px">
        <span>I agree to the <a href="/terms.html" target="_blank" style="color:var(--moss);font-weight:700">Terms of Service</a> and <a href="/privacy.html" target="_blank" style="color:var(--moss);font-weight:700">Privacy Policy</a></span>
      </label>
      <button class="btn gold block" style="margin-top:20px" type="submit" id="regBtn">Create account</button>
    </form>
    <hr class="divider-line"><p style="font-size:13.5px;color:var(--ink-soft)">Already a partner? <a href="/partner/login.html" style="color:var(--moss);font-weight:700">Log in</a></p>
  </div>
</div>

<div id="sb-footer"></div>
<script src="/js/api.js"></script>
<script>
renderNav();
renderFooter();
function safeNext(fallback) {
  const n = new URLSearchParams(location.search).get('next');
  return n && n.startsWith('/') && !n.startsWith('//') ? n : fallback;
}
function startCooldown(btn, label) {
  let s = 30; btn.disabled = true;
  const t = setInterval(() => { s--; if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = label; } else btn.textContent = `Resend in ${s}s`; }, 1000);
}
function showOtpStatus(el, result) {
  el.textContent = result.devCode ? `Code sent. (Development mode — your code is ${result.devCode})` : 'Code sent by SMS. It expires in 5 minutes.';
  el.style.color = result.devCode ? 'var(--gold)' : 'var(--moss)';
}

let otpEnabled = false, otpSentTo = null;
getConfig().then(cfg => {
  otpEnabled = !!cfg.otp;
  document.getElementById('sendOtpBtn').style.display = otpEnabled ? 'inline-flex' : 'none';
});
function phoneChanged() {
  const digits = document.getElementById('phone').value.replace(/\D/g, '');
  document.getElementById('sendOtpBtn').disabled = digits.length < 10;
  if (otpSentTo && otpSentTo !== digits) { otpSentTo = null; document.getElementById('otpBox').style.display = 'none'; }
}
async function sendOtp() {
  const btn = document.getElementById('sendOtpBtn');
  const phone = document.getElementById('phone').value.trim();
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await API.post('/auth/otp/send', { phone, purpose: 'registration' });
    otpSentTo = phone.replace(/\D/g, '');
    document.getElementById('otpBox').style.display = 'block';
    showOtpStatus(document.getElementById('otpStatus'), r);
    document.getElementById('otpCode').focus();
    startCooldown(btn, 'Resend OTP');
  } catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Send OTP'; }
}
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const name = v('name'), email = v('email'), phone = v('phone'), password = document.getElementById('password').value;
  const digits = phone.replace(/\D/g, '');
  if (name.length < 2) return toast('Please enter your full name.', 'error');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Please enter a valid email address.', 'error');
  if (digits.length < 10 || digits.length > 13) return toast('Please enter a valid mobile number.', 'error');
  if (password.length < 8) return toast('Password must be at least 8 characters.', 'error');
  if (password !== document.getElementById('password2').value) return toast('Passwords do not match.', 'error');
  if (!document.getElementById('agree').checked) return toast('Please accept the Terms and Privacy Policy.', 'error');
  const otpCode = v('otpCode');
  if (otpEnabled && !otpSentTo) return toast('Tap "Send OTP" to verify your mobile number first.', 'error');
  if (otpEnabled && !/^\d{6}$/.test(otpCode)) return toast('Enter the 6-digit code sent to your phone.', 'error');
  const btn = document.getElementById('regBtn'); btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const { token, user } = await API.post('/auth/register', { name, email, phone, password, otpCode, portal: PORTAL });
    API.saveSession(token, user);
    toast('Welcome to BookMySpa, ' + user.name.split(' ')[0] + '!');
    setTimeout(() => location.href = safeNext('/partner/dashboard.html'), 500);
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Create account'; }
});
</script>
</body>
</html>
