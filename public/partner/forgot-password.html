<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — BookMySpa Partners</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>

<div class="wrap auth-wrap">
  <div class="panel">
    <h2>Reset your password</h2>
    <p class="helper-text" style="margin-bottom:14px">We'll send a 6-digit code to the mobile number on your account.</p>
    <div id="unavailable" class="panel" style="display:none;background:var(--stone-dark)">
      <p style="margin:0;font-size:14px">Password reset by SMS isn't available yet. Please <a href="/contact.html" style="color:var(--moss);font-weight:700">contact support</a> and we'll help you get back in.</p>
    </div>
    <form id="resetForm" novalidate>
      <label for="phone">Registered mobile number</label>
      <div style="display:flex;gap:8px">
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" oninput="document.getElementById('sendBtn').disabled = this.value.replace(/\D/g,'').length < 10">
        <button type="button" class="btn small outline" style="white-space:nowrap" id="sendBtn" onclick="sendCode()" disabled>Send code</button>
      </div>
      <div id="step2" style="display:none">
        <label for="code">Verification code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
        <p class="helper-text" id="otpStatus"></p>
        <label for="pw1">New password</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="At least 8 characters">
        <label for="pw2">Confirm new password</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="Re-enter new password">
        <button class="btn gold block" style="margin-top:20px" type="submit" id="resetBtn">Set new password</button>
      </div>
    </form>
    <hr class="divider-line">
    <p style="font-size:13.5px;color:var(--ink-soft)">Remembered it? <a href="/partner/login.html" style="color:var(--moss);font-weight:700">Back to log in</a></p>
  </div>
</div>

<div id="sb-footer"></div>
<script src="/js/api.js"></script>
<script>
renderNav(); renderFooter();
getConfig().then(cfg => { if (!cfg.otp) { document.getElementById('unavailable').style.display = 'block'; document.getElementById('resetForm').style.display = 'none'; } });
async function sendCode() {
  const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await API.post('/auth/otp/send', { phone: document.getElementById('phone').value.trim(), purpose: 'login' });
    document.getElementById('step2').style.display = 'block';
    const st = document.getElementById('otpStatus');
    st.textContent = r.devCode ? `Code sent. (Development mode — your code is ${r.devCode})` : 'Code sent by SMS. It expires in 5 minutes.';
    st.style.color = r.devCode ? 'var(--gold)' : 'var(--moss)';
    document.getElementById('code').focus();
    let s = 30; const t = setInterval(() => { s--; if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = 'Resend code'; } else btn.textContent = `Resend in ${s}s`; }, 1000);
  } catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Send code'; }
}
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim(), pw = document.getElementById('pw1').value;
  if (!/^\d{6}$/.test(code)) return toast('Enter the 6-digit code.', 'error');
  if (pw.length < 8) return toast('Password must be at least 8 characters.', 'error');
  if (pw !== document.getElementById('pw2').value) return toast('Passwords do not match.', 'error');
  const btn = document.getElementById('resetBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await API.post('/auth/password/reset', { phone: document.getElementById('phone').value.trim(), code, newPassword: pw, portal: PORTAL });
    API.saveSession(r.token, r.user); toast(r.message);
    setTimeout(() => location.href = '/partner/dashboard.html', 700);
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Set new password'; }
});
</script>
</body>
</html>
