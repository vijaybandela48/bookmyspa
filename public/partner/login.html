<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner login — BookMySpa</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>

<div class="wrap auth-wrap">
  <div class="panel">
    <h2>Partner login</h2>
    <p class="helper-text" style="margin-bottom:14px">Manage your spa, bookings, and payments.</p>
    <div class="role-toggle" id="modeToggle" style="display:none">
      <button type="button" class="active" data-mode="password" onclick="setMode('password')">🔑 Password</button>
      <button type="button" data-mode="otp" onclick="setMode('otp')">💬 OTP</button>
    </div>
    <form id="pwForm" style="margin-top:16px" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      <p style="text-align:right;margin:6px 0 0;font-size:13px"><a href="/partner/forgot-password.html" style="color:var(--moss);font-weight:600">Forgot password?</a></p>
      <button class="btn gold block" style="margin-top:20px" type="submit" id="pwBtn">Log in</button>
    </form>
    <form id="otpForm" style="margin-top:16px;display:none" novalidate>
      <label for="otpPhone">Phone number</label>
      <div style="display:flex;gap:8px">
        <input id="otpPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" oninput="otpPhoneChanged()">
        <button type="button" class="btn small outline" style="white-space:nowrap" id="sendOtpBtn" onclick="sendOtp()" disabled>Send OTP</button>
      </div>
      <div id="otpBox" style="display:none">
        <label for="otpCode">Verification code</label>
        <input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
        <p class="helper-text" id="otpStatus"></p>
      </div>
      <button class="btn gold block" style="margin-top:20px" type="submit" id="otpLoginBtn" disabled>Log in with OTP</button>
    </form>
    <hr class="divider-line"><p style="font-size:13.5px;color:var(--ink-soft)">Not a partner yet? <a href="/partner/register.html" style="color:var(--moss);font-weight:700">List your spa</a></p>
  </div>
</div>

<div id="sb-footer"></div>
<script src="/js/api.js"></script>
<script>
renderNav();
renderFooter();
function safeNext(fallback) {
  const n = new URLSearchParams(location.search).get('next');
  return n && n.startsWith('/') && !n.startsWith('//') ? n : fallback;
}
function startCooldown(btn, label) {
  let s = 30; btn.disabled = true;
  const t = setInterval(() => { s--; if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = label; } else btn.textContent = `Resend in ${s}s`; }, 1000);
}
function showOtpStatus(el, result) {
  el.textContent = result.devCode ? `Code sent. (Development mode — your code is ${result.devCode})` : 'Code sent by SMS. It expires in 5 minutes.';
  el.style.color = result.devCode ? 'var(--gold)' : 'var(--moss)';
}

if (API.isLoggedIn() && API.user().role === PORTAL_ROLE[PORTAL]) location.href = safeNext('/partner/dashboard.html');
document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { toast('Enter your email and password.', 'error'); return; }
  const btn = document.getElementById('pwBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const { token, user } = await API.post('/auth/login', { email, password, portal: PORTAL });
    API.saveSession(token, user); toast('Welcome back, ' + user.name.split(' ')[0] + '!');
    setTimeout(() => location.href = safeNext('/partner/dashboard.html'), 400);
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Log in'; }
});
getConfig().then(cfg => { if (cfg.otp) document.getElementById('modeToggle').style.display = 'flex'; });
function setMode(m) {
  document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('pwForm').style.display = m === 'password' ? 'block' : 'none';
  document.getElementById('otpForm').style.display = m === 'otp' ? 'block' : 'none';
}
function otpPhoneChanged() {
  document.getElementById('sendOtpBtn').disabled = document.getElementById('otpPhone').value.replace(/\D/g, '').length < 10;
}
async function sendOtp() {
  const btn = document.getElementById('sendOtpBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await API.post('/auth/otp/send', { phone: document.getElementById('otpPhone').value.trim(), purpose: 'login' });
    document.getElementById('otpBox').style.display = 'block';
    document.getElementById('otpLoginBtn').disabled = false;
    showOtpStatus(document.getElementById('otpStatus'), r);
    document.getElementById('otpCode').focus();
    startCooldown(btn, 'Resend OTP');
  } catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Send OTP'; }
}
document.getElementById('otpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('otpCode').value.trim();
  if (!/^\d{6}$/.test(code)) { toast('Enter the 6-digit code.', 'error'); return; }
  const btn = document.getElementById('otpLoginBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const { token, user } = await API.post('/auth/otp/login', { phone: document.getElementById('otpPhone').value.trim(), code, portal: PORTAL });
    API.saveSession(token, user); toast('Welcome back, ' + user.name.split(' ')[0] + '!');
    setTimeout(() => location.href = safeNext('/partner/dashboard.html'), 400);
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Log in with OTP'; }
});
</script>
</body>
</html>
