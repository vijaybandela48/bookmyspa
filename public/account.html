<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My bookings — BookMySpa</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>
<div class="wrap page-body">
  <div class="eyebrow">Your account</div>
  <h1 style="margin-top:4px">My bookings</h1>
  <div id="list" style="margin-top:20px"><p>Loading…</p></div>
</div>

<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <h3 id="rvTitle">How was your visit?</h3>
    <div class="star-input" id="rvStars" style="margin:8px 0 2px">
      <button type="button" onclick="setStars(1)" aria-label="1 star">☆</button><button type="button" onclick="setStars(2)" aria-label="2 stars">☆</button><button type="button" onclick="setStars(3)" aria-label="3 stars">☆</button><button type="button" onclick="setStars(4)" aria-label="4 stars">☆</button><button type="button" onclick="setStars(5)" aria-label="5 stars">☆</button>
    </div>
    <p class="helper-text" id="rvLabel" style="margin:0 0 10px">Tap a star</p>
    <label for="rvComment">Tell others about it (optional)</label>
    <textarea id="rvComment" rows="4" maxlength="1000" placeholder="Therapist, cleanliness, ambience, value for money…"></textarea>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn outline block" onclick="closeReview()">Cancel</button>
      <button class="btn gold block" id="rvSubmit" onclick="submitReview()">Post review</button>
    </div>
    <p class="helper-text" style="margin-top:10px">Your first name and review will be shown publicly as a verified visit.</p>
  </div>
</div>
<div class="modal-overlay" id="rescheduleModal">
  <div class="modal">
    <h3 style="margin-bottom:2px">Reschedule</h3>
    <p class="helper-text" id="rsTitle" style="margin:0"></p>
    <p style="margin:6px 0 4px;font-size:14px" id="rsNow"></p>
    <label for="rsDate">New date</label>
    <select id="rsDate" onchange="loadRsSlots()"></select>
    <label>New time</label>
    <div class="slot-grid" id="rsSlots"></div>
    <p class="helper-text">Same service and price. Your booking ID stays the same, and you'll get a new confirmation.</p>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn outline block" onclick="document.getElementById('rescheduleModal').classList.remove('open')">Keep current time</button>
      <button class="btn gold block" id="rsConfirm" onclick="confirmReschedule()" disabled>Move my booking</button>
    </div>
  </div>
</div>
<div id="sb-footer"></div>

<script src="/js/api.js"></script>
<script>
renderNav('account');
renderFooter();

const AUTH_OK = API.requireRole();

const statusLabel = { pending_payment: 'Awaiting payment', confirmed: 'Confirmed', cancelled: 'Cancelled', completed: 'Completed' };

async function load() {
  const list = document.getElementById('list');
  try {
    const { bookings } = await API.get('/bookings/me');
    if (!bookings.length) {
      list.innerHTML = `<div class="empty-state"><div class="big">🗓️</div><p>No bookings yet.</p><a class="btn gold" href="/">Browse spas</a></div>`;
      return;
    }
    list.innerHTML = bookings.map(b => {
      const d = new Date(b.booking_date + 'T00:00:00');
      const canCancel = !!b.can_change;
      const lockedOut = ['pending_payment', 'confirmed'].includes(b.status) && !b.can_change && b.booking_date >= localISODate();
      return `
      <div class="ticket">
        <div class="stub">
          <div class="d">${d.getDate()}</div>
          <div class="m">${d.toLocaleDateString('en-IN', { month: 'short' })}</div>
          <div class="perforation"></div>
        </div>
        <div class="content">
          <div class="row1">
            <div>
              <h4>${b.service_name}</h4>
              <div class="sub">${b.spa_name} · ${b.spa_city}</div>
              ${b.booking_ref ? `<div class="mono" style="font-size:12.5px;color:var(--plum);margin-top:3px">Booking ID: ${esc(b.booking_ref)}</div>` : ''}
            </div>
            <div class="amount">${money(b.amount)}${b.coupon_code ? `<div style="font-size:11px;color:var(--gold);font-weight:600">🏷️ ${b.coupon_code} applied</div>` : ''}</div>
          </div>
          <div class="foot-row">
            <span class="badge ${b.status}">${statusLabel[b.status]}</span>
            ${b.payment_mode === 'pay_at_venue' && b.payment_status === 'unpaid' ? `<span class="badge pending">Pay ${money(b.amount)} at the spa</span>` : ''}
            <span class="helper-text" style="margin:0">${formatDate(b.booking_date)} at ${formatTime(b.start_time)}</span>
            ${b.notify_channel ? `<span class="helper-text" style="margin:0">📩 Sent by ${b.notify_channel.split(',').map(c => ({ sms: 'SMS', whatsapp: 'WhatsApp', email: 'Email' })[c] || c).join(' & ')}</span>` : ''}
            ${b.my_rating ? `<span class="stars" style="color:var(--gold)" title="Your rating">${starsHtml(b.my_rating)}</span>` : ''}
            ${b.can_review ? `<button class="btn small gold" onclick="openReview(${b.id}, '${esc(b.spa_name).replace(/'/g, '')}')">⭐ Rate your visit</button>` : ''}
            ${b.status === 'pending_payment' ? `<a class="btn small gold" href="/spa.html?id=${b.spa_id}">Pay now</a>` : ''}
            ${b.can_reschedule ? `<button class="btn small outline" onclick="openReschedule(${b.id})">Reschedule</button>` : ''}
            ${canCancel ? `<button class="btn small outline" onclick="cancelBooking(${b.id})">Cancel</button>` : ''}
          </div>
          <div class="ticket-note">
            ${b.status === 'confirmed' && canCancel ? `Free cancellation and rescheduling until ${new Date(b.change_deadline).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}` : ''}
            ${lockedOut ? `Free cancellation ended ${b.cancel_window_hours} hours before your appointment — call the spa to make changes.` : ''}
          </div>
        </div>
      </div>
      `;
    }).join('');
  } catch (e) {
    list.innerHTML = `<p>${e.message}</p>`;
  }
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking?')) return;
  try {
    const r = await API.put(`/bookings/${id}/cancel`);
    toast(r.message);
    load();
  } catch (e) {
    toast(e.message, 'error');
  }
}

let reviewBookingId = null, reviewRating = 0;
function openReview(id, spaName) {
  reviewBookingId = id; reviewRating = 0;
  document.getElementById('rvTitle').textContent = 'How was your visit to ' + spaName + '?';
  document.getElementById('rvComment').value = '';
  paintStars();
  document.getElementById('reviewModal').classList.add('open');
}
function closeReview() { document.getElementById('reviewModal').classList.remove('open'); }
function paintStars() {
  document.querySelectorAll('#rvStars button').forEach((b, i) => { b.textContent = i < reviewRating ? '★' : '☆'; });
  document.getElementById('rvLabel').textContent = ['Tap a star', 'Poor', 'Below average', 'Good', 'Very good', 'Excellent'][reviewRating];
}
function setStars(n) { reviewRating = n; paintStars(); }
async function submitReview() {
  if (!reviewRating) return toast('Please choose a star rating.', 'error');
  const btn = document.getElementById('rvSubmit'); btn.disabled = true;
  try {
    const r = await API.post(`/bookings/${reviewBookingId}/review`, { rating: reviewRating, comment: document.getElementById('rvComment').value.trim() });
    toast(r.message); closeReview(); load();
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; }
}

// ---------------- Reschedule ----------------
let rsBooking = null, rsSlot = null;
async function openReschedule(id) {
  const res = await API.get('/bookings/me');
  rsBooking = res.bookings.find(b => b.id === id); rsSlot = null;
  if (!rsBooking) return;
  document.getElementById('rsTitle').textContent = `${rsBooking.service_name} at ${rsBooking.spa_name}`;
  document.getElementById('rsNow').textContent = `Currently ${formatDate(rsBooking.booking_date)} at ${formatTime(rsBooking.start_time)}`;
  const sel = document.getElementById('rsDate'); sel.innerHTML = '';
  for (let i = 0; i < 14; i++) { const d = new Date(); d.setDate(d.getDate() + i); const iso = localISODate(d); sel.add(new Option(formatDate(iso), iso)); }
  sel.value = rsBooking.booking_date >= localISODate() ? rsBooking.booking_date : localISODate();
  document.getElementById('rsConfirm').disabled = true;
  document.getElementById('rescheduleModal').classList.add('open');
  loadRsSlots();
}
async function loadRsSlots() {
  const grid = document.getElementById('rsSlots'), date = document.getElementById('rsDate').value;
  rsSlot = null; document.getElementById('rsConfirm').disabled = true;
  grid.innerHTML = '<p class="helper-text">Loading times…</p>';
  try {
    const { slots, closed } = await API.get(`/bookings/${rsBooking.id}/reschedule-slots?date=${date}`);
    if (closed) { grid.innerHTML = `<p class="helper-text">${esc(closed)}</p>`; return; }
    const open = slots.filter(s => s.available);
    grid.innerHTML = open.length ? open.map(s => `<button type="button" class="slot available" data-t="${s.start_time}" onclick="pickRs('${s.start_time}')">${formatTime(s.start_time)}</button>`).join('')
      : '<p class="helper-text">No free times this day — try another date.</p>';
  } catch (e) { grid.innerHTML = `<p class="helper-text">${esc(e.message)}</p>`; }
}
function pickRs(t) {
  rsSlot = t;
  document.querySelectorAll('#rsSlots .slot').forEach(b => b.classList.toggle('selected', b.dataset.t === t));
  document.getElementById('rsConfirm').disabled = false;
}
async function confirmReschedule() {
  const btn = document.getElementById('rsConfirm'); btn.disabled = true; btn.textContent = 'Moving…';
  try {
    const r = await API.put(`/bookings/${rsBooking.id}/reschedule`, { date: document.getElementById('rsDate').value, startTime: rsSlot });
    toast(r.message); document.getElementById('rescheduleModal').classList.remove('open'); load();
  } catch (e) { toast(e.message, 'error'); btn.disabled = false; }
  finally { btn.textContent = 'Move my booking'; }
}

if (AUTH_OK) load();
</script>
</body>
</html>
