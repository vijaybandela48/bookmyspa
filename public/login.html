<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — SpaBook</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>
<div class="wrap auth-wrap">
  <div class="panel">
    <h2>Welcome back</h2>
    <p class="helper-text" style="margin-bottom:14px">Log in to book a slot, manage your spa, or access the admin panel.</p>
    <div class="role-toggle">
      <button type="button" class="active" data-mode="password" onclick="setLoginMode('password')">🔑 Password</button>
      <button type="button" data-mode="otp" onclick="setLoginMode('otp')">💬 OTP</button>
    </div>

    <form id="loginForm" style="margin-top:16px">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
      <button class="btn gold block" style="margin-top:20px" type="submit">Log in</button>
    </form>

    <form id="otpLoginForm" style="margin-top:16px;display:none">
      <label>Phone number</label>
      <div style="display:flex;gap:8px">
        <input id="otpPhone" required placeholder="10-digit mobile number" oninput="onOtpPhoneChanged()">
        <button type="button" class="btn small outline" style="white-space:nowrap" id="sendLoginOtpBtn" onclick="sendLoginOtp()" disabled>Send OTP</button>
      </div>
      <div id="loginOtpSection" style="display:none">
        <label>Verification code</label>
        <input id="loginOtpCode" placeholder="6-digit code" inputmode="numeric" maxlength="6">
        <p class="helper-text" id="loginOtpStatus"></p>
      </div>
      <button class="btn gold block" style="margin-top:20px" type="submit" id="otpLoginBtn" disabled>Log in with OTP</button>
    </form>
    <hr class="divider-line">
    <p style="font-size:13.5px;color:var(--ink-soft)">
      New here? <a href="/register.html" style="color:var(--moss);font-weight:700">Create an account</a>
    </p>
    <hr class="divider-line">
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.7">
      <strong>Demo logins</strong><br>
      Customer: customer@spabook.demo / customer123<br>
      Spa owner: owner1@spabook.demo / owner123<br>
      Admin: admin@spabook.demo / admin123
    </p>
  </div>
</div>

<div id="sb-footer"></div>

<script src="/js/api.js"></script>
<script>
renderNav();
renderFooter();
function goToRoleHome(user) {
  if (user.role === 'owner') window.location.href = '/owner/index.html';
  else if (user.role === 'admin') window.location.href = '/admin/index.html';
  else window.location.href = '/';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const { token, user } = await API.post('/auth/login', { email, password });
    API.saveSession(token, user);
    toast('Welcome back, ' + user.name.split(' ')[0] + '!');
    setTimeout(() => goToRoleHome(user), 400);
  } catch (err) {
    toast(err.message, 'error');
  }
});

function setLoginMode(mode) {
  document.querySelectorAll('.role-toggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('loginForm').style.display = mode === 'password' ? 'block' : 'none';
  document.getElementById('otpLoginForm').style.display = mode === 'otp' ? 'block' : 'none';
}

function onOtpPhoneChanged() {
  const phone = document.getElementById('otpPhone').value.replace(/\D/g, '');
  document.getElementById('sendLoginOtpBtn').disabled = phone.length < 10;
  document.getElementById('loginOtpSection').style.display = 'none';
  document.getElementById('otpLoginBtn').disabled = true;
}

let loginOtpCooldownTimer = null;
async function sendLoginOtp() {
  const btn = document.getElementById('sendLoginOtpBtn');
  const phone = document.getElementById('otpPhone').value.trim();
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const result = await API.post('/auth/otp/send', { phone, purpose: 'login' });
    document.getElementById('loginOtpSection').style.display = 'block';
    document.getElementById('otpLoginBtn').disabled = false;
    const statusEl = document.getElementById('loginOtpStatus');
    statusEl.textContent = result.devCode
      ? `Code sent. (Dev mode — no SMS provider configured, your code is ${result.devCode})`
      : 'Code sent by SMS. It expires in 5 minutes.';
    statusEl.style.color = result.devCode ? 'var(--gold)' : 'var(--moss)';
    document.getElementById('loginOtpCode').focus();

    let seconds = 30;
    clearInterval(loginOtpCooldownTimer);
    loginOtpCooldownTimer = setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) { clearInterval(loginOtpCooldownTimer); btn.disabled = false; btn.textContent = 'Resend OTP'; }
      else { btn.textContent = `Resend in ${seconds}s`; }
    }, 1000);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; btn.textContent = 'Send OTP';
  }
}

document.getElementById('otpLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = document.getElementById('otpPhone').value.trim();
  const code = document.getElementById('loginOtpCode').value.trim();
  if (!code) { toast('Enter the verification code.', 'error'); return; }
  const btn = document.getElementById('otpLoginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const { token, user } = await API.post('/auth/otp/login', { phone, code });
    API.saveSession(token, user);
    toast('Welcome back, ' + user.name.split(' ')[0] + '!');
    setTimeout(() => goToRoleHome(user), 400);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; btn.textContent = 'Log in with OTP';
  }
});
</script>
</body>
</html>
