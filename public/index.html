<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMySpa — Book massage &amp; spa appointments</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#23392C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="sb-nav"></div>

<section class="hero">
  <div class="steam" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <svg class="jasmine" viewBox="0 0 240 280" aria-hidden="true">
    <path pathLength="1" d="M18 272 C 52 222, 64 176, 104 140 S 170 84, 196 38"/>
    <path pathLength="1" d="M104 140 C 128 150, 150 168, 158 196"/>
    <path pathLength="1" d="M62 206 C 34 200, 22 178, 30 160 C 50 168, 62 184, 62 206 Z"/>
    <path pathLength="1" d="M140 102 C 166 104, 182 90, 184 72 C 162 72, 146 84, 140 102 Z"/>
    <path pathLength="1" d="M128 162 C 150 152, 168 160, 176 176 C 156 184, 138 178, 128 162 Z"/>
    <g class="petals"><path class="petal" pathLength="1" transform="rotate(0 196 38)" d="M196 38 C 186 24, 190 10, 196 4 C 202 10, 206 24, 196 38 Z"/><path class="petal" pathLength="1" transform="rotate(72 196 38)" d="M196 38 C 186 24, 190 10, 196 4 C 202 10, 206 24, 196 38 Z"/><path class="petal" pathLength="1" transform="rotate(144 196 38)" d="M196 38 C 186 24, 190 10, 196 4 C 202 10, 206 24, 196 38 Z"/><path class="petal" pathLength="1" transform="rotate(216 196 38)" d="M196 38 C 186 24, 190 10, 196 4 C 202 10, 206 24, 196 38 Z"/><path class="petal" pathLength="1" transform="rotate(288 196 38)" d="M196 38 C 186 24, 190 10, 196 4 C 202 10, 206 24, 196 38 Z"/><path class="petal" pathLength="1" transform="rotate(36 158 196)" d="M158 196 C 150 185, 153 174, 158 169 C 163 174, 166 185, 158 196 Z"/><path class="petal" pathLength="1" transform="rotate(108 158 196)" d="M158 196 C 150 185, 153 174, 158 169 C 163 174, 166 185, 158 196 Z"/><path class="petal" pathLength="1" transform="rotate(180 158 196)" d="M158 196 C 150 185, 153 174, 158 169 C 163 174, 166 185, 158 196 Z"/><path class="petal" pathLength="1" transform="rotate(252 158 196)" d="M158 196 C 150 185, 153 174, 158 169 C 163 174, 166 185, 158 196 Z"/><path class="petal" pathLength="1" transform="rotate(324 158 196)" d="M158 196 C 150 185, 153 174, 158 169 C 163 174, 166 185, 158 196 Z"/>
    </g>
    <circle cx="196" cy="38" r="3"/><circle cx="158" cy="196" r="2.4"/><circle cx="210" cy="120" r="2"/><circle cx="84" cy="122" r="1.8"/>
  </svg>
  <div class="wrap">
    <h1>Unwind nearby.<br>Book in seconds.</h1>
    <p class="sub">Real spas around you, live availability and reviews from verified visits. Pay online, or pay at the spa.</p>
    <div class="search-bar">
      <input id="searchInput" placeholder="Search spas or treatments..." />
      <select id="cityInput"><option value="">All cities</option></select>
      <button onclick="doSearch()">Search</button>
    </div>
  </div>
</section>
<svg class="steam-divider" viewBox="0 0 1200 40" preserveAspectRatio="none">
  <path d="M0,20 C150,0 300,40 450,20 C600,0 750,40 900,20 C1050,0 1150,30 1200,18 L1200,40 L0,40 Z"></path>
</svg>

<div class="wrap page-body">
  <div class="loc-bar" id="locBar">
    <span class="loc-text" id="locText">📍 Finding spas near you…</span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="locActions"></div>
  </div>

  <div id="featuredWrap" style="display:none">
    <div class="section-title-row" style="margin-top:0">
      <div><div class="eyebrow">⭐ Featured</div><h2 style="margin-top:4px">Featured spas</h2></div>
      <span class="helper-text">Promoted listings</span>
    </div>
    <div class="featured-strip" id="featuredStrip"></div>
  </div>

  <div class="section-title-row" style="margin-top:0">
    <div><div class="eyebrow" id="resultsEyebrow">Featured</div><h2 style="margin-top:4px">Spas open for booking</h2></div>
  </div>
  <div class="tabs">
    <div class="tab" data-sort="nearby" onclick="setSortMode('nearby')">📍 Nearby</div>
    <div class="tab" data-sort="featured" onclick="setSortMode('featured')">⭐ Featured</div>
    <div class="tab" data-sort="rating" onclick="setSortMode('rating')">🏆 All spas · Top rated</div>
  </div>
  <div class="grid" id="spaGrid"><p>Loading spas…</p></div>
</div>

<div id="sb-footer"></div>

<script src="/js/api.js"></script>
<script>
renderNav('home');
renderFooter();

const FEATURED_RADIUS_KM = 30;
let userLocation = savedLocation();
let sortMode = userLocation ? 'nearby' : 'rating';

async function loadCities() {
  try {
    const { cities } = await API.get('/spas/cities');
    const sel = document.getElementById('cityInput');
    cities.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
  } catch {}
}

function spaCard(spa) {
  const cover = spa.cover_image_url ? `<img src="${esc(spa.cover_image_url)}" alt="${esc(spa.name)}" style="width:100%;height:100%;object-fit:cover">` : esc(spa.cover_emoji);
  return `
    <a class="spa-card" href="/spa.html?id=${spa.id}">
      <div class="cover" style="${spa.cover_image_url ? 'padding:0' : ''}">${cover}${spa.featured ? '<span class="feat-badge">⭐ Featured</span>' : ''}</div>
      <div class="body">
        <h3>${esc(spa.name)}</h3>
        <div class="meta">📍 ${esc(spa.address || spa.city)}${spa.distance_km != null ? ` · <span class="dist">${fmtDistance(spa.distance_km)}</span>` : ''}</div>
        <div class="desc">${esc(spa.description || '')}</div>
        <div class="foot"><span>${ratingHtml(spa)}</span><span class="btn small outline">View services</span></div>
      </div>
    </a>`;
}

function spaQuery(extra = {}) {
  const p = new URLSearchParams();
  const city = document.getElementById('cityInput').value, search = document.getElementById('searchInput').value.trim();
  if (city) p.set('city', city);
  if (search) p.set('search', search);
  if (userLocation) { p.set('lat', userLocation.lat); p.set('lng', userLocation.lng); }
  for (const [k, v] of Object.entries(extra)) p.set(k, v);
  return '/spas?' + p.toString();
}

async function loadFeatured() {
  if (sortMode === 'featured') { document.getElementById('featuredWrap').style.display = 'none'; return; } // the tab itself lists them
  try {
    let { spas } = await API.get(spaQuery({ sort: 'featured', featured: '1' }));
    // Featured placements are local advertising: when we know where the customer is,
    // only show featured spas within FEATURED_RADIUS_KM, nearest first.
    if (userLocation) spas = spas.filter(s => s.distance_km != null && s.distance_km <= FEATURED_RADIUS_KM).sort((a, b) => a.distance_km - b.distance_km);
    document.getElementById('featuredWrap').style.display = spas.length ? 'block' : 'none';
    document.getElementById('featuredStrip').innerHTML = spas.map(spaCard).join('');
  } catch { document.getElementById('featuredWrap').style.display = 'none'; }
}

async function loadSpas() {
  const grid = document.getElementById('spaGrid');
  grid.innerHTML = '<p>Loading spas…</p>';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sort === sortMode));
  document.getElementById('resultsEyebrow').textContent =
    sortMode === 'nearby' ? `Nearest first · from ${userLocation ? userLocation.label : 'you'}` : sortMode === 'rating' ? 'All spas · top rated first' : 'Featured spas only · promoted listings';
  try {
    const { spas } = await API.get(spaQuery(sortMode === 'featured' ? { sort: 'featured', featured: '1' } : { sort: sortMode }));
    grid.innerHTML = spas.length ? spas.map(spaCard).join('')
      : sortMode === 'featured'
        ? `<div class="empty-state" style="grid-column:1/-1"><div class="big">⭐</div><p>No featured spas right now.</p><button class="btn small outline" onclick="setSortMode('rating')">See all spas</button></div>`
        : `<div class="empty-state" style="grid-column:1/-1"><div class="big">🧴</div><p>No spas found. Try a different search or city.</p></div>`;
  } catch (e) { grid.innerHTML = `<p>Could not load spas: ${esc(e.message)}</p>`; }
}

function renderLocBar(state) {
  const text = document.getElementById('locText'), actions = document.getElementById('locActions');
  if (state === 'have') {
    text.innerHTML = `📍 Showing distances from <strong>${esc(userLocation.label)}</strong>`;
    actions.innerHTML = `<button class="btn small outline" onclick="useMyLocation()">↻ Refresh my location</button><button class="btn small outline" onclick="showAreaSearch()">Change area</button>`;
  } else if (state === 'denied') {
    text.innerHTML = '📍 Location is off. Allow location for this site in your browser settings to see the nearest spas — or pick an area.';
    actions.innerHTML = `<button class="btn small gold" onclick="useMyLocation()">Try again</button><button class="btn small outline" onclick="showAreaSearch()">Pick an area</button>`;
  } else if (state === 'locating') {
    text.innerHTML = '📍 Getting your current location…'; actions.innerHTML = '';
  } else {
    text.innerHTML = '📍 See the spas closest to you right now';
    actions.innerHTML = `<button class="btn small gold" onclick="useMyLocation()">Use my current location</button><button class="btn small outline" onclick="showAreaSearch()">Pick an area</button>`;
  }
}

async function useMyLocation() {
  renderLocBar('locating');
  try {
    userLocation = await getCurrentLocation();
    sortMode = 'nearby';
    renderLocBar('have'); loadSpas(); loadFeatured();
  } catch (e) {
    renderLocBar(e && e.code === 1 ? 'denied' : 'ask');
    if (!(e && e.code === 1)) toast("Couldn't get your location. Pick an area instead.", 'error');
  }
}

async function showAreaSearch() {
  const cfg = await getConfig();
  const actions = document.getElementById('locActions');
  if (!cfg.googleMapsKey) {
    toast('Choose your city from the search bar above to filter spas.');
    document.getElementById('cityInput').focus();
    return;
  }
  try {
    await loadGoogleMapsApi(cfg.googleMapsKey);
    const { PlaceAutocompleteElement } = await google.maps.importLibrary('places');
    const ac = new PlaceAutocompleteElement({ includedRegionCodes: ['in'] });
    ac.setAttribute('placeholder', 'Search your area, e.g. Banjara Hills');
    actions.innerHTML = ''; actions.appendChild(ac);
    ac.addEventListener('gmp-select', async ({ placePrediction }) => {
      const place = placePrediction.toPlace();
      await place.fetchFields({ fields: ['displayName', 'location'] });
      userLocation = saveLocation(place.location.lat(), place.location.lng(), place.displayName || 'selected area');
      sortMode = 'nearby'; renderLocBar('have'); loadSpas(); loadFeatured();
    });
  } catch { toast('Area search is unavailable right now. Use the city filter instead.', 'error'); }
}

function setSortMode(mode) {
  if (mode === 'nearby' && !userLocation) { useMyLocation(); return; }
  sortMode = mode; loadSpas(); loadFeatured();
}
function doSearch() { loadSpas(); loadFeatured(); }
document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
document.getElementById('cityInput').addEventListener('change', doSearch);

(async function init() {
  loadCities();
  const perm = await locationPermission();
  // If location is allowed, ALWAYS re-read where the customer is right now on every visit
  // (show the last known position instantly, then update to the fresh one).
  if (perm === 'granted') {
    if (userLocation && userLocation.label === 'your current location') { renderLocBar('have'); loadSpas(); loadFeatured(); }
    return useMyLocation();
  }
  if (userLocation) renderLocBar('have');           // an area the customer picked manually
  else renderLocBar(perm === 'denied' ? 'denied' : 'ask');
  loadSpas(); loadFeatured();
})();
</script>
</body>
</html>
